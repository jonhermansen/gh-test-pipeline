name: test
on:
  pull_request:

jobs:
  build:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.3.0
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'report.xml'
